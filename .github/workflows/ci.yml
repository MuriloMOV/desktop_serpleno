name: CI

on:
  push:
    branches: ["main", "refatoracao-e-redesign", "**"]
  pull_request:
    branches: ["main", "refatoracao-e-redesign"]

jobs:
  lint-type-test:
    name: Lint, type-check and unit tests (no UI)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/ser_pleno tests

      - name: Mypy type check
        run: mypy src/ser_pleno

      - name: Pytest (unit tests only, exclude ui_heavy)
        run: pytest tests/ -v --tb=short -m "not ui_heavy"

  ui-tests:
    name: UI Tests (isolated subprocesses)
    runs-on: windows-latest
    needs: lint-type-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pytest (UI tests in isolated subprocesses)
        run: python runners/run_ui_tests.py