[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ser-pleno"
version = "1.0.0"
description = "Sistema Desktop de gestão escolar e bem-estar (SerPleno)"
requires-python = ">=3.13"
dependencies = [
    "customtkinter>=5.2",
    "mysql-connector-python>=9.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py313"]
